<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bình Chọn & Quản Lý Tiền Sân Bóng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
  <div class="max-w-2xl mx-auto px-4 py-6">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-lg">
          <i class="fa-solid fa-futbol"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white leading-tight">Điểm Danh & Thu Quỹ</h1>
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="syncStatus" class="text-xs text-slate-400">Đang kết nối Realtime...</span>
          </div>
        </div>
      </div>
      <button onclick="resetDefaults()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700 transition" title="Đặt lại dữ liệu mẫu">
        <i class="fa-solid fa-rotate-right mr-1"></i> Reset
      </button>
    </header>

    <!-- Thông tin trận đấu -->
    <section class="bg-slate-800/80 backdrop-blur rounded-2xl p-5 border border-slate-700/60 shadow-lg mb-6">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20">
          <i class="fa-regular fa-clock mr-1"></i> 19:30 • Thứ 6 này
        </span>
      </div>
      <h2 class="text-xl font-bold text-white mb-2">Trận Siêu Kinh Điển Thứ 6 ⚽🔥</h2>
      <div class="grid grid-cols-2 gap-3 text-sm text-slate-300 mb-4">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-rose-400"></i>
          <span>Sân bóng Thanh Niên</span>
        </div>
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-money-bill-wave text-amber-400"></i>
          <span>50.000đ / người</span>
        </div>
      </div>

      <!-- Thống kê nhanh -->
      <div class="grid grid-cols-3 gap-3 pt-3 border-t border-slate-700/60 text-center">
        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
          <p class="text-xs text-slate-400">Cầu thủ đi</p>
          <p id="statGoing" class="text-lg font-bold text-emerald-400">0</p>
        </div>
        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
          <p class="text-xs text-slate-400">Đã thu quỹ</p>
          <p id="statPaid" class="text-lg font-bold text-emerald-400">0đ</p>
        </div>
        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
          <p class="text-xs text-slate-400">Còn thiếu</p>
          <p id="statRemain" class="text-lg font-bold text-amber-400">0đ</p>
        </div>
      </div>
    </section>

    <!-- Thêm cầu thủ & Tìm kiếm -->
    <div class="flex gap-2 mb-4">
      <input type="text" id="newPlayerInput" placeholder="Nhập tên cầu thủ mới..." 
        class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
        onkeydown="if(event.key==='Enter') addPlayer()">
      <button onclick="addPlayer()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition flex items-center gap-1.5">
        <i class="fa-solid fa-user-plus"></i> Thêm
      </button>
    </div>

    <!-- Bộ lọc & Copy -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
      <div class="flex gap-1.5 overflow-x-auto text-xs py-1" id="filterTabs">
        <button onclick="setFilter('all')" class="filter-btn active bg-emerald-600 text-white px-3 py-1.5 rounded-lg" data-filter="all">Tất cả</button>
        <button onclick="setFilter('going')" class="filter-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700" data-filter="going">Đi</button>
        <button onclick="setFilter('unpaid')" class="filter-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700" data-filter="unpaid">Chưa nộp</button>
        <button onclick="setFilter('leave')" class="filter-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700" data-filter="leave">Nghỉ</button>
      </div>
      <button onclick="copySummary()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
        <i class="fa-solid fa-copy"></i> Copy Gửi Zalo/Mess
      </button>
    </div>

    <!-- Danh sách cầu thủ -->
    <div id="playerList" class="space-y-3">
      <!-- Cầu thủ render ở đây -->
    </div>
  </div>

  <script>
    // Cấu hình Firebase Realtime Database của bạn
    const firebaseConfig = {
      databaseURL: "https://diemdanh-bongda-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const dataRef = db.ref("match_roster");

    const FEE = 50000;
    let currentFilter = 'all';
    let roster = [];

    const defaultRoster = [
      { id: 1, name: "Phú (C)", status: "going", paid: true },
      { id: 2, name: "Tuấn Anh", status: "going", paid: true },
      { id: 3, name: "Minh Đức", status: "going", paid: false },
      { id: 4, name: "Huy Hoàng", status: "going", paid: false },
      { id: 5, name: "Văn Hậu", status: "maybe", paid: false },
      { id: 6, name: "Đức Chinh", status: "leave", paid: false },
      { id: 7, name: "Quang Hải", status: "going", paid: true }
    ];

    // Lắng nghe dữ liệu Realtime
    dataRef.on('value', (snapshot) => {
      document.getElementById('syncStatus').innerText = "Tự động đồng bộ Realtime";
      const val = snapshot.val();
      if (val) {
        roster = val;
      } else {
        roster = defaultRoster;
        dataRef.set(defaultRoster);
      }
      render();
    }, (error) => {
      document.getElementById('syncStatus').innerText = "Lỗi kết nối cơ sở dữ liệu";
      console.error(error);
    });

    function saveToCloud() {
      dataRef.set(roster);
    }

    function render() {
      const list = document.getElementById("playerList");
      list.innerHTML = "";

      let countGoing = 0;
      let countPaid = 0;

      roster.forEach(p => {
        if (p.status === "going") {
          countGoing++;
          if (p.paid) countPaid++;
        }
      });

      document.getElementById("statGoing").innerText = countGoing;
      document.getElementById("statPaid").innerText = (countPaid * FEE).toLocaleString('vi-VN') + "đ";
      document.getElementById("statRemain").innerText = ((countGoing - countPaid) * FEE).toLocaleString('vi-VN') + "đ";

      const filtered = roster.filter(p => {
        if (currentFilter === 'going') return p.status === 'going';
        if (currentFilter === 'unpaid') return p.status === 'going' && !p.paid;
        if (currentFilter === 'leave') return p.status === 'leave';
        return true;
      });

      filtered.forEach(p => {
        const item = document.createElement("div");
        item.className = "bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow";

        const firstLetter = p.name.trim().charAt(0).toUpperCase();

        item.innerHTML = `
          <div class="flex items-center justify-between sm:justify-start gap-3">
            <div class="w-10 h-10 rounded-full bg-slate-700 border border-slate-600 flex items-center justify-center font-bold text-white text-sm">
              ${firstLetter}
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="font-semibold text-white text-base">${p.name}</span>
                ${p.status === 'going' ? '<span class="text-xs text-emerald-400">⚽</span>' : ''}
              </div>
              <div class="text-xs ${p.status === 'going' ? (p.paid ? 'text-emerald-400' : 'text-amber-400') : 'text-slate-400'}">
                ${p.status === 'going' ? (p.paid ? '<i class="fa-solid fa-circle-check"></i> Đã nộp tiền' : '<i class="fa-regular fa-clock"></i> Chưa đóng tiền') : (p.status === 'maybe' ? '50/50' : 'Đã báo nghỉ')}
              </div>
            </div>
            <button onclick="removePlayer(${p.id})" class="text-slate-500 hover:text-rose-400 text-xs ml-auto sm:ml-2 p-1" title="Xóa">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>

          <div class="flex items-center gap-1.5 overflow-x-auto text-xs">
            <button onclick="updateStatus(${p.id}, 'going')" class="px-2.5 py-1.5 rounded-lg border ${p.status === 'going' ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-700/50 text-slate-300 border-slate-600 hover:bg-slate-700'}">🔥 Đi</button>
            <button onclick="updateStatus(${p.id}, 'maybe')" class="px-2.5 py-1.5 rounded-lg border ${p.status === 'maybe' ? 'bg-amber-600 text-white border-amber-500' : 'bg-slate-700/50 text-slate-300 border-slate-600 hover:bg-slate-700'}">⏳ 50/50</button>
            <button onclick="updateStatus(${p.id}, 'leave')" class="px-2.5 py-1.5 rounded-lg border ${p.status === 'leave' ? 'bg-rose-600 text-white border-rose-500' : 'bg-slate-700/50 text-slate-300 border-slate-600 hover:bg-slate-700'}">❌ Nghỉ</button>
            ${p.status === 'going' ? `
              <button onclick="togglePaid(${p.id})" class="ml-1 px-2.5 py-1.5 rounded-lg border ${p.paid ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : 'bg-amber-500/20 text-amber-300 border-amber-500/40'}">
                ${p.paid ? '✓ Đã đóng' : 'Chưa nộp'}
              </button>
            ` : ''}
          </div>
        `;
        list.appendChild(item);
      });
    }

    function updateStatus(id, status) {
      roster = roster.map(p => p.id === id ? { ...p, status } : p);
      saveToCloud();
    }

    function togglePaid(id) {
      roster = roster.map(p => p.id === id ? { ...p, paid: !p.paid } : p);
      saveToCloud();
    }

    function addPlayer() {
      const input = document.getElementById("newPlayerInput");
      const name = input.value.trim();
      if (!name) return;
      roster.push({
        id: Date.now(),
        name: name,
        status: "going",
        paid: false
      });
      input.value = "";
      saveToCloud();
    }

    function removePlayer(id) {
      if (!confirm("Bạn có chắc chắn muốn xóa cầu thủ này?")) return;
      roster = roster.filter(p => p.id !== id);
      saveToCloud();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.getAttribute('data-filter') === filter) {
          btn.className = "filter-btn active bg-emerald-600 text-white px-3 py-1.5 rounded-lg";
        } else {
          btn.className = "filter-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700";
        }
      });
      render();
    }

    function resetDefaults() {
      if (confirm("Đặt lại danh sách mẫu ban đầu?")) {
        roster = defaultRoster;
        saveToCloud();
      }
    }

    function copySummary() {
      let goingList = roster.filter(p => p.status === 'going').map((p, i) => `${i+1}. ${p.name} (${p.paid ? 'Đã đóng' : 'Chưa đóng'})`).join('\n');
      let maybeList = roster.filter(p => p.status === 'maybe').map(p => p.name).join(', ');
      let text = `⚽ BÌNH CHỌN ĐÁ BÓNG THỨ 6\n📍 Sân bóng Thanh Niên (19:30)\n💵 Tiền sân: 50k/người\n\nDanh sách đá (${roster.filter(p=>p.status==='going').length} người):\n${goingList || 'Chưa có ai'}\n\nChưa chốt (50/50): ${maybeList || 'Không có'}\n\n👉 Anh em vào link này tự cập nhật nhé: ${window.location.href}`;
      navigator.clipboard.writeText(text).then(() => {
        alert("Đã sao chép nội dung chốt danh sách để gửi nhóm Zalo/Mess!");
      });
    }
  </script>
</body>
</html>
